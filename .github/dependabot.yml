version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Stay on LTS lines: Node 25 is not LTS.
      - dependency-name: "node"
        versions: ["25.x", "25-alpine"]
