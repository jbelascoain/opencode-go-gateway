name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: opencode-go-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name gateway -p 4000:4000 \
            -e PROXY_TOKEN=test-token \
            -e OPENCODE_API_KEY=test-key \
            opencode-go-gateway:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:4000/v1/chat/completions \
            -H 'content-type: application/json' -d '{}')
          test "$code" = "401"

      - name: Container logs
        if: failure()
        run: docker logs gateway || true
