name: dockerhub-description

# DOCKERHUB_TOKEN must be a Personal Access Token with the
# "Read, Write, Delete" scope. "Read & Write" is not enough for the
# description API and returns 403 Forbidden.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/opencode-go-gateway
          # Docker Hub truncates this field at 100 bytes.
          short-description: Dependency-free gateway that adds x-opencode-session for OpenCode Go.
          readme-filepath: ./README.md
          # Rewrites relative links (LICENSE, SECURITY.md) to absolute GitHub URLs,
          # which is what Docker Hub needs.
          enable-url-completion: "true"
